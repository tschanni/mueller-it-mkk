name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: 'true'

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build
        env:
          CI: 'true'
          PUBLIC_URL: '.'
          REACT_APP_GAME_API_BASE_URL: https://api.mueller-it-mkk.de
          REACT_APP_PROFILE_IMAGE_UPLOAD_URL: https://api.mueller-it-mkk.de/games/api/v1/me/avatar
          REACT_APP_MINECRAFT_MAP_URL: https://api.mueller-it-mkk.de/private-map/
          REACT_APP_MINECRAFT_LIVE_WHITELIST: 'true'

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
